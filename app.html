<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma · Plan Nutricional</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar" id="sidebar">
  <a href="#dashboard" class="side-brand">
    <img src="assets/logo-angelica.png" alt="Logo" class="side-logo">
    <div class="side-brand-text">
      <span class="side-name" id="brand-name">Plan Nutricional</span>
      <span class="side-sub">Plataforma profesional</span>
    </div>
  </a>

  <nav class="side-nav">
    <a href="#dashboard" data-route="dashboard" class="side-link">
      <svg viewBox="0 0 24 24" class="side-ico"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#clientes" data-route="clientes" class="side-link">
      <svg viewBox="0 0 24 24" class="side-ico"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>Clientes</span>
    </a>
    <a href="#agenda" data-route="agenda" class="side-link">
      <svg viewBox="0 0 24 24" class="side-ico"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
      <span>Agenda</span>
    </a>
    <a href="plan.html" class="side-link" id="link-nuevo-plan">
      <svg viewBox="0 0 24 24" class="side-ico"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z"/></svg>
      <span>Crear plan</span>
    </a>
  </nav>

  <div class="side-foot">
    <div class="side-user">
      <div class="side-avatar" id="user-avatar">N</div>
      <div class="side-user-text">
        <span class="side-user-name" id="user-name">Nutricionista</span>
        <span class="side-user-mail" id="user-mail"></span>
      </div>
    </div>
    <button class="side-logout" id="btn-logout" type="button">Cerrar sesión</button>
  </div>
</aside>

<!-- Botón menú móvil -->
<button class="mobile-burger" id="mobile-burger" type="button" aria-label="Menú">
  <span></span><span></span><span></span>
</button>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<!-- ===== Contenido ===== -->
<main class="content" id="view">
  <!-- platform.js inyecta cada vista aquí -->
</main>

<!-- ===== Modal genérico ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal-card" id="modal-card">
    <button class="modal-x" id="modal-x" type="button" aria-label="Cerrar">×</button>
    <div id="modal-body"><!-- contenido dinámico --></div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast-wrap" id="toast-wrap"></div>

<script src="store.js"></script>
<script src="platform.js"></script>
</body>
</html>
